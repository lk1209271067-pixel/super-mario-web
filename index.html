<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Mario Web - 网页版超级玛丽</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>SUPER MARIO WEB</h1>
    <canvas id="game" width="768" height="448"></canvas>
    <div class="help">
      <span><b>← → / A D</b> 移动</span>
      <span><b>空格 / W / ↑</b> 跳跃（长按跳更高）</span>
      <span><b>Shift</b> 加速跑</span>
      <span><b>C</b> 第二关射击 / 第三关投掷</span>
      <span><b>R</b> 重新开始</span>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
